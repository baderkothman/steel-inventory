name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish, for example v1.0.6"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Build and publish universal macOS app
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+(\.[0-9]+){2}([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.0.6 or v1.0.6-beta.1. Got: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag matches application version
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [[ "${app_version}" != "${tag_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match tauri.conf.json version ${app_version}." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify updater signing secret
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATER_PRIVATE_KEY}" ]]; then
            echo "Missing GitHub secret: TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          fi

      - name: Build, sign, and publish macOS release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Steel Inventory ${{ env.RELEASE_TAG }}"
          releaseBody: "Download the DMG for the first installation. Existing updater-enabled installations can install this release from inside the app."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: >-
            --target universal-apple-darwin
            --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
